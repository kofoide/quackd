name: Release

# Push a tag like v1.0.0 to build the release artifacts, publish a GitHub Release,
# and point the Homebrew tap (kofoide/homebrew-tap) at it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches QUACKD_VERSION
        run: |
          version="$(make -s version)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != QUACKD_VERSION $version"; exit 1; }
      - name: Install tools
        run: brew install shellcheck duckdb
      - name: Lint and test
        run: make lint test
      - name: Build artifacts
        run: make dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/dist/quackd
            build/dist/Quackd-*.zip
            build/dist/SHA256SUMS
          body: |
            See [CHANGELOG.md](https://github.com/kofoide/quackd/blob/main/CHANGELOG.md) for what's new.

            **Quackd.app is not notarized.** After unzipping, move it to Applications and open it. macOS will block it the first time: go to **System Settings → Privacy & Security** and click **Open Anyway**. Alternatively, build it yourself with `make install-app`, which skips this step.

      # Runs after publishing, so a problem here never blocks the release itself.
      # HOMEBREW_TAP_TOKEN is a fine-grained token with Contents: Read and write on
      # homebrew-tap only; this workflow's own GITHUB_TOKEN can't push to another repo.
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN isn't set, so the tap wasn't updated. See docs/releasing.md."
            exit 0
          fi
          version="$(make -s version)"
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/kofoide/homebrew-tap.git" "$tap"
          scripts/update-tap.sh "$tap" "$version" "build/dist/Quackd-$version.zip"
          cd "$tap"
          if git diff --quiet; then
            echo "The tap already points at $version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "quackd $version"
          git push
